    <script>
      (function () {
        try {
          var saved = localStorage.getItem('bacse106_dark_mode_v1');
          var isDark =
            saved === 'dark' ||
            (saved === null &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
